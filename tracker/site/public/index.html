<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="მოსწავლეები"><meta name="theme-color" content="#16a34a"><title>მოსწავლეების აღრიცხვა</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ac:#16a34a;--red:#dc2626;--amb:#d97706;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2026;--tx:#e8eaed;--mut:#9aa3ad;--bd:#2c333b}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:20px}.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{font-size:12px;color:var(--mut);display:block}
input,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:8px 12px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.r{background:var(--red)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.row:first-child{border-top:0}.b{font-weight:600}.m{color:var(--mut);font-size:13px}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid}
.over{color:var(--red)}.soon{color:var(--amb)}.ok{color:var(--ac)}.off{opacity:.5}
.act{display:flex;gap:6px;flex-wrap:wrap}.sum{display:flex;gap:16px;flex-wrap:wrap}
</style></head><body><main>
<h1>🏋️ მოსწავლეების აღრიცხვა</h1>
<div class="card sum" id="sum"></div>

<div class="card" id="rem"></div>

<div class="card"><b id="ft">ახალი მოსწავლე</b>
<div class="grid" style="margin-top:8px">
<div><label>სახელი *</label><input id="name"></div>
<div><label>ტელეფონი * (5XXXXXXXX)</label><input id="phone" inputmode="tel"></div>
<div><label>თანხა ₾ *</label><input id="fee" type="number" min="0"></div>
<div><label>გადახდის დღე თვეში (1-31) *</label><input id="dueDay" type="number" min="1" max="31"></div>
<div><label>დაწყების თარიღი (არასავალდებულო)</label><input id="startDate" type="date"></div>
<div><label>შენიშვნა</label><input id="note"></div></div>
<p><button onclick="saveM()" id="sb">დამატება</button> <button class="g" onclick="reset()">გასუფთავება</button></p></div>

<div class="card"><b>SMS ტექსტი</b> <span class="m">(იგზავნება გადახდის წინა დღეს. თითო მოსწავლეს თავისი სახელი, თანხა და თარიღი ჩაუდგება)</span>
<textarea id="tpl" rows="3" style="margin-top:8px" oninput="preview()"></textarea>
<div class="chips" style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><span class="m">დაამატე:</span>
<button type="button" onclick="insVar('{name}')">👤 სახელი</button><button type="button" onclick="insVar('{amount}')">💰 თანხა</button><button type="button" onclick="insVar('{date}')">📅 თარიღი</button></div>
<div class="m" id="pv" style="margin-top:8px;padding:8px;border:1px dashed var(--bd);border-radius:6px"></div>

<p><button onclick="saveT()">შენახვა</button> <span id="tm" class="m"></span></p></div>

<div class="card" id="list"></div>
<p class=m><button class=g onclick="backup()">⬇ ბექაპი</button> <label style="display:inline"><input type=file accept=".json" onchange="restore(event)" style="display:none"><span class="g" style="padding:8px 12px;border:1px solid var(--bd);border-radius:6px;cursor:pointer">⬆ აღდგენა</span></label></p>
</main>
<script>
let S={members:[]},editId=null,PIN=localStorage.getItem('pin')||'';const $=i=>document.getElementById(i);
const pad=n=>String(n).padStart(2,'0');
const addDays=(i,n)=>{const d=new Date(i+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const ddmm=iso=>String(iso).split('-').reverse().join('.');
async function api(method,u,b){
 const r=await fetch('/api/'+u,{method,headers:{'Content-Type':'application/json','x-pin':PIN},body:b?JSON.stringify(b):undefined});
 const j=await r.json().catch(()=>({}));
 if(r.status===401){PIN=prompt(PIN?'არასწორი PIN, სცადე თავიდან':'შეიყვანე PIN')||'';localStorage.setItem('pin',PIN);if(PIN)return api(method,u,b);throw new Error('PIN საჭიროა')}
 if(!r.ok)throw new Error(j.error||('შეცდომა '+r.status));return j}
async function backup(){try{const d=await api('GET','export');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='trainer-backup.json';a.click()}catch(e){alert(e.message)}}
function restore(e){const f=e.target.files[0];e.target.value='';if(!f)return;f.text().then(async t=>{try{const d=JSON.parse(t);
 if(!confirm(`ფაილში ${d.members?.length||0} მოსწავლეა. სერვერზე არსებული მონაცემები ჩანაცვლდება. გავაგრძელო?`))return;await api('POST','import',d);load()}catch(x){alert(x.message)}})}
let migrated=false;
async function migrate(){if(migrated||S.members.length)return;migrated=true;let L;try{L=JSON.parse(localStorage.getItem('trainer')||'null')}catch(e){}
 if(L&&L.members&&L.members.length&&confirm(`ამ ტელეფონში ნაპოვნია ${L.members.length} მოსწავლე. გადავიტანო სერვერზე (SMS-ების ავტომატური გაგზავნისთვის)?`)){try{await api('POST','import',L);load()}catch(e){alert(e.message)}}}
const diff=d=>Math.round((new Date(d)-new Date(S.today))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load(){try{S=await api('GET','state')}catch(e){$('list').innerHTML='<span class=m>'+esc(e.message)+'</span>';return}
 $('tpl').value=S.template;render();preview();migrate()}
function rem(){const t=S.today,tm=addDays(t,1);
 const list=S.members.filter(m=>m.active&&m.nextDue===tm);
 const mode=S.sms==='live'?'':S.sms==='test'?'<div class=m style="color:var(--red)">⚠ ტესტ რეჟიმი: SMS რეალურად არ იგზავნება</div>':'<div class=m style="color:var(--red)">⚠ UBill გასაღები არ არის დაყენებული</div>';
 $('rem').innerHTML='<b>📩 ხვალინდელი შეხსენებები</b> <span class=m>(იგზავნება თავისით ყოველდღე 10:00-ზე)</span>'+mode+(list.length?list.map(m=>{const s=S.sent[m.id+':'+m.nextDue];
  return `<div class=row><div><div class=b>${esc(m.name)}</div><div class=m>${m.fee} ₾ · ${ddmm(m.nextDue)}</div></div><span class="tag ${s?'ok':'soon'}">${s?'✓ გაიგზავნა':'⏳ 10:00-ზე გაიგზავნება'}</span></div>`}).join('')+'<p><button class=g onclick="runNow()">▶ გაგზავნა ახლავე</button></p>':'<div class=m style="margin-top:6px">ხვალ გადახდა არავის აქვს</div>')}
async function runNow(){if(!confirm('გავგზავნო შეხსენებები ახლავე? უკვე გაგზავნილებს არ გაუგზავნის.'))return;try{const r=await api('POST','run');alert(`გაიგზავნა: ${r.sent.length}`+(r.failed.length?`\nვერ გაიგზავნა:\n${r.failed.map(f=>f.name+' — '+f.error).join('\n')}`:''));load()}catch(e){alert(e.message)}}
function render(){rem();
 const a=S.members.filter(m=>m.active);
 const over=a.filter(m=>diff(m.nextDue)<0),soon=a.filter(m=>diff(m.nextDue)>=0&&diff(m.nextDue)<=3);
 $('sum').innerHTML=`<div><b>${a.length}</b><div class=m>აქტიური</div></div><div><b>${a.reduce((s,m)=>s+m.fee,0)} ₾</b><div class=m>თვიური შემოსავალი</div></div>
 <div class=over><b>${over.length}</b><div class=m>ვადაგადაცილებული</div></div><div class=soon><b>${soon.length}</b><div class=m>3 დღეში იხდის</div></div>`;
 const sorted=[...S.members].sort((x,y)=>(y.active-x.active)||x.nextDue.localeCompare(y.nextDue));
 $('list').innerHTML=sorted.length?sorted.map(m=>{const d=diff(m.nextDue);
  const st=d<0?`<span class="tag over">ვადა გადაცილებულია ${-d} დღით</span>`:d===0?`<span class="tag soon">დღეს</span>`:d<=3?`<span class="tag soon">${d} დღეში</span>`:`<span class="tag ok">${d} დღეში</span>`;
  return `<div class="row ${m.active?'':'off'}"><div><div class=b>${esc(m.name)} ${st}</div>
  <div class=m>${esc(m.phone)} · ${m.fee} ₾ · შემდეგი გადახდა: ${m.nextDue} (ყოველი ${m.dueDay}-ე)${m.startDate?' · აყვანილია: '+m.startDate:''}${m.note?' · '+esc(m.note):''}</div></div>
  <div class=act><button onclick="paid(${m.id})">✓ გადაიხადა</button><button class=g onclick="edit(${m.id})">რედ.</button>
  <button class=g onclick="test(${m.id})">ტესტ SMS</button><button class=g onclick="tog(${m.id})">${m.active?'პაუზა':'გააქტიურება'}</button>
  <button class="g" onclick="del(${m.id})">🗑</button></div></div>`}).join(''):'<span class=m>ჯერ არავინ არის დამატებული</span>'}
const F=['name','phone','fee','dueDay','startDate','note'];
function reset(){editId=null;F.forEach(f=>$(f).value='');$('sb').textContent='დამატება';$('ft').textContent='ახალი მოსწავლე'}
function edit(id){const m=S.members.find(x=>x.id===id);editId=id;F.forEach(f=>$(f).value=m[f]??'');$('sb').textContent='შენახვა';$('ft').textContent='რედაქტირება';scrollTo(0,0)}
async function saveM(){try{const b={};F.forEach(f=>b[f]=$(f).value);
 await(editId?api('PUT','members/'+editId,b):api('POST','members',b));reset();load()}catch(e){alert(e.message)}}
const act=async(u,m='POST')=>{try{await api(m,u);load()}catch(e){alert(e.message)}};
const paid=id=>act(`members/${id}/paid`),tog=id=>act(`members/${id}/toggle`);
const del=id=>confirm('წავშალო?')&&act('members/'+id,'DELETE');
const test=async id=>{if(!confirm('გავგზავნო სატესტო SMS ამ მოსწავლის ნომერზე?'))return;try{await api('POST',`members/${id}/test`);alert('გაიგზავნა')}catch(e){alert(e.message)}};
function insVar(v){const t=$('tpl'),a=t.selectionStart??t.value.length,b=t.selectionEnd??a;t.value=t.value.slice(0,a)+v+t.value.slice(b);t.focus();t.selectionStart=t.selectionEnd=a+v.length;preview()}
function preview(){const m=(S.members||[]).find(x=>x.active)||{name:'ნინო',fee:80,nextDue:S.today};
 $('pv').innerHTML='<b>მაგალითი ('+esc(m.name)+'):</b><br>'+esc($('tpl').value.replaceAll('{name}',m.name).replaceAll('{amount}',m.fee).replaceAll('{date}',ddmm(m.nextDue)))}
async function saveT(){await api('PUT','template',{template:$('tpl').value});$('tm').textContent='შენახულია ✓'}
load();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
