<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--red:#dc2626;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--tx:#f3f4f6;--mut:#9ca3af;--bd:#2d323b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
header b{font-size:18px}header small{color:#f87171;font-weight:600}
main{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
.top{display:flex;gap:12px;align-items:center}
.ph{width:68px;height:68px;border-radius:10px;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.nm{font-weight:700;font-size:16px;line-height:1.2}
.sub{color:var(--mut);font-size:13px;margin-top:3px;line-height:1.4}.sub b{color:var(--tx)}
.edit{border:0;background:none;font-size:20px;padding:6px;color:var(--mut)}
.bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd)}
.left{font-size:14px;color:var(--mut)}.left b{font-size:18px;color:var(--tx)}.left.low b{color:var(--red)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:50%;border:0;font-size:28px;line-height:1;background:var(--bd);color:var(--tx)}
.step button.p{background:var(--red);color:#fff}
.step span{min-width:44px;text-align:center;font-size:26px;font-weight:800}
.add{width:100%;padding:13px;border:1px dashed var(--mut);background:none;color:var(--mut);border-radius:12px;font-size:15px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:5;overflow:auto;padding:16px}
form{background:var(--card);border-radius:14px;padding:14px;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
form h3{margin:0}label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:var(--bg);color:var(--tx)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px}.btns button{flex:1;padding:13px;border:0;border-radius:8px;font-size:16px;background:var(--bd);color:var(--tx)}
.btns button.ok{background:var(--red);color:#fff;flex:2}.btns button.del{background:none;color:var(--red);flex:none;padding:13px 10px}
#pv{width:84px;height:84px;border-radius:10px;object-fit:cover;background:var(--bd);display:none}
#msg{text-align:center;color:var(--mut);padding:20px}
</style></head><body>
<header><b>🏋️ დანამატები</b><small id="tot"></small></header>
<main><div id="list"><div id="msg">იტვირთება…</div></div>
<button class="add" onclick="openForm(null)">＋ ახალი პროდუქტი</button></main>

<div id="ov"><form id="f" onsubmit="save(event)">
<h3 id="ft">ახალი პროდუქტი</h3>
<label>დასახელება<input id="n" required></label>
<div class="row2"><label>შეკვრის ფასი ₾<input id="c" type="number" inputmode="decimal" step="any"></label>
<label>1 მიღების ფასი ₾<input id="p" type="number" inputmode="decimal" step="any"></label></div>
<div class="row2"><label>რამდენი მიღებაა<input id="t" type="number" inputmode="numeric"></label>
<label>რამდენი გაიყიდა<input id="s" type="number" inputmode="numeric"></label></div>
<label>📷 ფოტო<img id="pv"><input id="fp" type="file" accept="image/*"></label>
<div class="btns"><button type="button" class="del" id="dl" onclick="del()">🗑</button><button type="button" onclick="closeForm()">გაუქმება</button><button class="ok" id="sv">შენახვა</button></div>
</form></div>
<input id="file" type="file" accept="image/*" style="display:none">
<script>
let PIN=localStorage.getItem('pin')||'',D=[],editRow=null,photoRow=null,pend=0,chain=Promise.resolve();const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n===''||n==null?'-':String(Math.round(Number(n)*100)/100).replace('.',',');
function run(fn,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](PIN,...a))}
const err=e=>alert((e&&e.message)||e);
async function load(){try{const r=await run('getData');D=r.products;
 $('tot').textContent=r.revenue?`შემოსავალი: ${fmt(r.revenue)} ₾`:'';draw()}
 catch(e){if(/PIN/.test((e&&e.message)||e)){PIN=prompt('შეიყვანე PIN')||'';localStorage.setItem('pin',PIN);load()}else $('list').innerHTML='<div id=msg>'+esc((e&&e.message)||e)+'</div>'}}
function card(p){const left=p.total?p.total-p.sold:null;
 return `<div class=card id=r${p.row}><div class=top>
 <div class=ph onclick="pick(${p.row})">${p.photo?`<img src="${esc(p.photo)}">`:'📷'}</div>
 <div class=info><div class=nm>${esc(p.name)}</div>
 <div class=sub>შეკვრა: <b>${fmt(p.cost)} ₾</b> · 1 მიღება: <b>${fmt(p.price)} ₾</b><br>სულ: <b>${p.total||'-'}</b> მიღება</div></div>
 <button class=edit onclick="openForm(${p.row})">✎</button></div>
 <div class=bot><div class="left ${left!==null&&left<=5?'low':''}">${left!==null?'დარჩა <b>'+left+'</b>':''}</div>
 <div class=step><button onclick="chg(${p.row},-1)">−</button><span>${p.sold}</span><button class=p onclick="chg(${p.row},1)">+</button></div></div></div>`}
function draw(){$('list').innerHTML=D.length?D.map(card).join(''):'<div id=msg>პროდუქტი არ არის</div>'}
function redraw(p){const el=$('r'+p.row);if(el)el.outerHTML=card(p)}
function chg(row,d){const p=D.find(x=>x.row===row);
 p.sold=Math.max(0,p.total?Math.min(p.sold+d,p.total):p.sold+d);redraw(p);pend++;   // მაშინვე ჩანს
 chain=chain.then(()=>run('changeSold',row,d)).then(v=>{pend--;if(!pend){p.sold=v;redraw(p)}navigator.vibrate&&navigator.vibrate(10)},
  e=>{pend--;err(e);load()})}   // დაკლიკებები რიგრიგობით იგზავნება
// ---- ფორმა: ახალი / რედაქტირება ----
function openForm(row){editRow=row;$('f').reset();$('pv').style.display='none';
 $('ft').textContent=row?'რედაქტირება':'ახალი პროდუქტი';$('dl').style.display=row?'':'none';
 if(row){const p=D.find(x=>x.row===row);$('n').value=p.name;$('c').value=p.cost;$('p').value=p.price;$('t').value=p.total||'';$('s').value=p.sold||'';
  if(p.photo){$('pv').src=p.photo;$('pv').style.display='block'}}
 $('ov').style.display='block'}
function closeForm(){$('ov').style.display='none'}
const shrink=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{
 const s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};im.onerror=()=>no('ფოტოს წაკითხვა ვერ მოხერხდა');im.src=URL.createObjectURL(f)});
async function save(e){e.preventDefault();const b=$('sv');b.disabled=true;b.textContent='ინახება…';
 try{const d={name:$('n').value,cost:$('c').value,price:$('p').value,total:$('t').value,sold:$('s').value};
  let row=editRow;if(row)await run('updateProduct',row,d);else row=await run('addProduct',d);
  const f=$('fp').files[0];if(f){b.textContent='ფოტო იტვირთება…';await run('uploadPhoto',row,await shrink(f))}
  closeForm();await load()}catch(x){err(x)}b.disabled=false;b.textContent='შენახვა'}
async function del(){if(!confirm('წავშალო ეს პროდუქტი?'))return;try{await run('deleteProduct',editRow);closeForm();load()}catch(x){err(x)}}
// ---- ფოტოს შეცვლა ბარათიდან ----
function pick(row){photoRow=row;$('file').click()}
$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const p=D.find(x=>x.row===photoRow);
 const ph=$('r'+photoRow).querySelector('.ph');ph.textContent='⏳';
 try{p.photo=await run('uploadPhoto',photoRow,await shrink(f))}catch(x){err(x)}redraw(p)};
load();
</script></body></html>
