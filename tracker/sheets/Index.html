<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mut:#6b7280;--red:#dc2626;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d23;--tx:#f3f4f6;--mut:#9ca3af;--bd:#2d323b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{position:sticky;top:0;background:#111;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:2}
header b{font-size:18px}header small{color:#f87171;font-weight:600}
main{padding:12px;max-width:560px;margin:0 auto}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px}
.ph{width:64px;height:64px;border-radius:10px;background:var(--bd);object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.nm{font-weight:700;font-size:15px;line-height:1.2}.sub{color:var(--mut);font-size:13px;margin-top:2px}
.low{color:var(--red);font-weight:700}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:44px;height:44px;border-radius:50%;border:0;font-size:26px;line-height:1;background:var(--bd);color:var(--tx)}
.step button.p{background:var(--red);color:#fff}
.step span{min-width:34px;text-align:center;font-size:24px;font-weight:800}
.add{width:100%;padding:12px;border:1px dashed var(--mut);background:none;color:var(--mut);border-radius:12px;font-size:15px}
form{display:none;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:10px;gap:8px;flex-direction:column}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:var(--bg);color:var(--tx)}
form button{padding:12px;border:0;border-radius:8px;background:var(--red);color:#fff;font-size:16px}
#msg{text-align:center;color:var(--mut);padding:20px}
</style></head><body>
<header><b>🏋️ დანამატები</b><small id="tot"></small></header>
<main><div id="list"><div id="msg">იტვირთება…</div></div>
<button class="add" onclick="f.style.display='flex';this.style.display='none'">＋ ახალი პროდუქტი</button>
<form id="f" onsubmit="addP(event)">
<input id="n" placeholder="დასახელება" required><input id="c" type="number" inputmode="decimal" placeholder="თვითღირებულება ₾">
<input id="p" type="number" inputmode="decimal" placeholder="ფასი ერთ მიღებაზე ₾"><input id="t" type="number" inputmode="numeric" placeholder="სულ მიღება (რაოდენობა)">
<button>დამატება</button></form></main>
<input id="file" type="file" accept="image/*" style="display:none">
<script>
let PIN=localStorage.getItem('pin')||'',D=[],photoRow=null;const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function run(fn,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](PIN,...a))}
async function load(){try{const r=await run('getData');D=r.products;
 $('tot').textContent=r.revenue?`შემოსავალი ${Math.round(r.revenue*100)/100} ₾`:'';draw()}
 catch(e){if(/PIN/.test(e.message||e)){PIN=prompt('შეიყვანე PIN')||'';localStorage.setItem('pin',PIN);load()}else $('list').innerHTML='<div id=msg>'+esc(e.message||e)+'</div>'}}
function draw(){$('list').innerHTML=D.length?D.map(p=>{const left=p.total?p.total-p.sold:null;
 return `<div class=card id=r${p.row}><div class=ph onclick="pick(${p.row})">${p.photo?`<img src="${esc(p.photo)}">`:'📷'}</div>
 <div class=info><div class=nm>${esc(p.name)}</div><div class=sub>${p.price?p.price+' ₾':''}${left!==null?` · <span class="${left<=5?'low':''}">დარჩა ${left}</span>`:''}</div></div>
 <div class=step><button onclick="chg(${p.row},-1)">−</button><span>${p.sold}</span><button class=p onclick="chg(${p.row},1)">+</button></div></div>`}).join(''):'<div id=msg>პროდუქტი არ არის</div>'}
let pend=0,chain=Promise.resolve();
function chg(row,d){const p=D.find(x=>x.row===row);
 p.sold=Math.max(0,p.total?Math.min(p.sold+d,p.total):p.sold+d);draw();pend++;   // მაშინვე ჩანს
 chain=chain.then(()=>run('changeSold',row,d)).then(v=>{pend--;if(!pend){p.sold=v;draw()}navigator.vibrate&&navigator.vibrate(10)},
  e=>{pend--;alert((e.message||e)+' — გვერდი ახლდება');load()})}   // დაკლიკებები რიგრიგობით იგზავნება
async function addP(e){e.preventDefault();try{await run('addProduct',{name:$('n').value,cost:$('c').value,price:$('p').value,total:$('t').value});
 $('f').reset();$('f').style.display='none';document.querySelector('.add').style.display='';load()}catch(x){alert(x.message||x)}}
function pick(row){photoRow=row;$('file').click()}
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=async()=>{
 const s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);
 try{const u=await run('uploadPhoto',photoRow,c.toDataURL('image/jpeg',.8));D.find(x=>x.row===photoRow).photo=u;draw()}catch(x){alert(x.message||x)}};
 im.src=URL.createObjectURL(f);e.target.value=''};
load();
</script></body></html>
