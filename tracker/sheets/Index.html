<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f1f2f4;--card:#fff;--alt:#f6f7f9;--tx:#111;--mut:#6b7280;--red:#e11d2e;--bd:#e5e7eb;--dot:#c4c8cf}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f12;--card:#181b20;--alt:#1d2127;--tx:#f3f4f6;--mut:#9ca3af;--bd:#2d323b;--dot:#555b66}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#0b0b0b;color:#fff;padding:14px 16px 12px;border-bottom:3px solid var(--red);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
header h1{margin:0;font-size:20px;letter-spacing:1px}header h1 span{color:var(--red)}
header small{color:#9ca3af;font-size:10px;letter-spacing:2px;text-transform:uppercase}
#tot{background:#0b0b0b;color:#f87171;font-weight:700;font-size:13px;padding:0 16px 8px;text-align:right}
main{padding:10px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.card:nth-child(even){background:var(--alt)}
.top{display:flex;gap:10px;align-items:center}
.ph{width:60px;height:60px;border-radius:8px;background:var(--bd);flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}.nm{font-weight:800;font-size:14px;text-transform:uppercase;line-height:1.15}
.tag{display:inline-block;margin-top:5px;background:var(--red);color:#fff;font-weight:700;font-size:12px;padding:2px 7px;border-radius:3px}
.tot{text-align:center;flex:none;min-width:62px}.tot b{display:block;font-size:26px;line-height:1}.tot small{font-size:9px;letter-spacing:1px;color:var(--red);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0 8px}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dot);display:block}
.dots i.s{background:var(--red);border-color:var(--red)}
.bot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.left{font-size:13px;color:var(--mut)}.left.low{color:var(--red);font-weight:700}
.step{display:flex;align-items:center;gap:8px}
.step button{width:46px;height:46px;border-radius:50%;border:0;font-size:28px;line-height:1;background:var(--bd);color:var(--tx)}
.step button.p{background:var(--red);color:#fff}
.step span{min-width:44px;text-align:center;font-size:26px;font-weight:800}
.add{width:100%;padding:13px;border:1px dashed var(--mut);background:none;color:var(--mut);border-radius:12px;font-size:15px}
form{display:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:10px;gap:8px;flex-direction:column}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:var(--bg);color:var(--tx)}
form button{padding:12px;border:0;border-radius:8px;background:var(--red);color:#fff;font-size:16px}
label.fl{font-size:14px;color:var(--mut);display:flex;flex-direction:column;gap:6px}
#msg{text-align:center;color:var(--mut);padding:20px}
</style></head><body>
<header><h1>SERVINGS <span>TRACKER</span></h1><small>Premium Fitness Bar</small></header>
<div id="tot"></div>
<main><div id="list"><div id="msg">იტვირთება…</div></div>
<button class="add" onclick="f.style.display='flex';this.style.display='none'">＋ ახალი პროდუქტი</button>
<form id="f" onsubmit="addP(event)">
<input id="n" placeholder="დასახელება" required>
<input id="c" type="number" inputmode="decimal" placeholder="შეკვრის ფასი ₾">
<input id="p" type="number" inputmode="decimal" placeholder="1 მიღების ფასი ₾">
<input id="t" type="number" inputmode="numeric" placeholder="რამდენი მიღებაა">
<label class="fl">📷 ფოტო (არასავალდებულო)<input id="fp" type="file" accept="image/*"></label>
<button>დამატება</button></form></main>
<input id="file" type="file" accept="image/*" style="display:none">
<script>
let PIN=localStorage.getItem('pin')||'',D=[],photoRow=null,pend=0,chain=Promise.resolve();const $=i=>document.getElementById(i);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n===''||n==null?'-':String(Math.round(Number(n)*100)/100).replace('.',',');
function run(fn,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](PIN,...a))}
async function load(){try{const r=await run('getData');D=r.products;
 $('tot').textContent=r.revenue?`შემოსავალი: ${fmt(r.revenue)} ₾`:'';draw()}
 catch(e){if(/PIN/.test(e.message||e)){PIN=prompt('შეიყვანე PIN')||'';localStorage.setItem('pin',PIN);load()}else $('list').innerHTML='<div id=msg>'+esc(e.message||e)+'</div>'}}
function dots(p){let h='';for(let i=0;i<p.total;i++)h+=`<i class="${i<p.sold?'s':''}"></i>`;return h}
function card(p){const left=p.total?p.total-p.sold:null;
 return `<div class=card id=r${p.row}><div class=top>
 <div class=ph onclick="pick(${p.row})">${p.photo?`<img src="${esc(p.photo)}">`:'📷'}</div>
 <div class=info><div class=nm>${esc(p.name)}</div><span class=tag>${fmt(p.cost)} / ${fmt(p.price)}₾</span></div>
 <div class=tot><b>${p.total||'-'}</b><small>SERVINGS</small></div></div>
 <div class=dots>${dots(p)}</div>
 <div class=bot><div class="left ${left!==null&&left<=5?'low':''}">${left!==null?'დარჩა '+left:''}</div>
 <div class=step><button onclick="chg(${p.row},-1)">−</button><span>${p.sold}</span><button class=p onclick="chg(${p.row},1)">+</button></div></div></div>`}
function draw(){$('list').innerHTML=D.length?D.map(card).join(''):'<div id=msg>პროდუქტი არ არის</div>'}
function redraw(p){const el=$('r'+p.row);if(el)el.outerHTML=card(p)}
function chg(row,d){const p=D.find(x=>x.row===row);
 p.sold=Math.max(0,p.total?Math.min(p.sold+d,p.total):p.sold+d);redraw(p);pend++;   // მაშინვე ჩანს
 chain=chain.then(()=>run('changeSold',row,d)).then(v=>{pend--;if(!pend){p.sold=v;redraw(p)}navigator.vibrate&&navigator.vibrate(10)},
  e=>{pend--;alert((e.message||e)+' — გვერდი ახლდება');load()})}   // დაკლიკებები რიგრიგობით იგზავნება
const shrink=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{
 const s=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};im.onerror=no;im.src=URL.createObjectURL(f)});
async function addP(e){e.preventDefault();const btn=e.submitter;btn.disabled=true;btn.textContent='ინახება…';
 try{const row=await run('addProduct',{name:$('n').value,cost:$('c').value,price:$('p').value,total:$('t').value});
  const f=$('fp').files[0];if(f)await run('uploadPhoto',row,await shrink(f));
  $('f').reset();$('f').style.display='none';document.querySelector('.add').style.display='';load()}
 catch(x){alert(x.message||x)}btn.disabled=false;btn.textContent='დამატება'}
function pick(row){photoRow=row;$('file').click()}
$('file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const u=await run('uploadPhoto',photoRow,await shrink(f));const p=D.find(x=>x.row===photoRow);p.photo=u;redraw(p)}catch(x){alert(x.message||x)}};
load();
</script></body></html>
