services:
  - type: web
    name: trainer-tracker
    runtime: node
    plan: starter            # მუდმივი დისკისთვის ფასიანი გეგმაა საჭირო (~$7/თვე)
    rootDir: tracker
    buildCommand: echo ok
    startCommand: node server.js
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /data/data.json
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMS_PROVIDER
        value: log           # smsoffice-ზე გადასვლისას შეცვალე
      - key: SMSOFFICE_KEY
        sync: false
      - key: SMSOFFICE_SENDER
        sync: false
